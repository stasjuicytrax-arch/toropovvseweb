<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f3">
  <meta name="description" content="Объёмный логотип в минималистичном пространстве с перспективой от наклона телефона.">
  <title>STAS TOROPOV — пространство</title>
  <link rel="preload" as="image" href="assets/logo.png">
  <link rel="stylesheet" href="space.css?v=2">
  <script type="module" src="spatial.js?v=2"></script>
</head>
<body>
  <main id="stage" class="stage" tabindex="0" aria-label="Объёмный логотип STAS TOROPOV" aria-describedby="interaction-help">
    <div id="fallback" class="fallback"><img src="assets/logo.png" width="810" height="179" alt="STAS TOROPOV" fetchpriority="high"></div>
    <canvas id="space" class="space" role="img" aria-label="Металлический логотип и три объёмных портала на разной глубине" hidden></canvas>
    <button id="sensor-activation" class="sensor-activation" type="button" aria-label="Разрешить изменение перспективы от наклона телефона" hidden><span>Коснись пространства</span></button>
    <p id="interaction-help" class="sr-only">Наклони телефон, перемещай курсор или используй стрелки клавиатуры. Escape возвращает камеру в центр.</p>
    <p id="status" class="sr-only" role="status"></p>
  </main>
</body>
</html>
