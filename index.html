<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf2f7">
  <meta name="description" content="Технический прототип параллакса с реакцией на наклон телефона.">
  <title>Тест глубины — Стас Торопов</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="demo">
    <header><span>Стас Торопов</span><span class="prototype">Тест параллакса</span></header>
    <section class="scene" aria-label="Трёхмерная сцена для проверки глубины">
      <div class="world" aria-hidden="true">
        <div class="plane plane-back"></div>
        <div class="plane plane-middle"></div>
        <div class="plane plane-front"></div>
        <div class="orb orb-back"></div>
        <div class="orb orb-front"></div>
      </div>
      <div class="scene-copy"><h1>Почувствуй<br>глубину.</h1><p>Наклони телефон.<br>Сцена изменит перспективу.</p></div>
    </section>
    <section class="controls" aria-label="Управление движением">
      <div class="primary-controls"><button id="enable" type="button" disabled>Включить наклон</button><button id="pause" type="button" disabled>Пауза</button></div>
      <div class="secondary-controls"><button id="recenter" type="button" disabled>Задать центр</button><button id="replay" type="button" disabled>Показать движение</button></div>
      <p id="status" role="status">Загрузка управления…</p>
      <noscript><p>Для движения нужен JavaScript. Ссылки на проекты доступны ниже.</p></noscript>
    </section>
    <nav class="projects" aria-label="Проекты Стаса Торопова">
      <a href="https://stastoropov.ru/">stastoropov.ru</a>
      <a href="https://help-wedding.ru/">help-wedding.ru</a>
      <a href="https://st-event.com/">st-event.com</a>
      <a href="https://karaokerave.ru/">karaokerave.ru</a>
    </nav>
  </main>
</body>
</html>
