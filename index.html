<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8d9cb8">
  <meta name="description" content="Стас Торопов: ведущий, свадебное агентство «В титрах», ST EVENT, Караоке Рейв и Новогодняя ночь в Перми.">
  <title>Стас Торопов — проекты</title>
  <link rel="preload" as="image" href="assets/hero-mobile-v7.png">
  <link rel="preload" as="font" href="assets/fonts/onest-regular.woff2" type="font/woff2" crossorigin>
  <link rel="preload" as="font" href="assets/fonts/onest-semibold.woff2" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="mobile.css?v=6">
  <script src="liquid-glass.js?v=2" defer></script>
  <script src="projects.js?v=3" defer></script>
</head>
<body>
  <svg class="filter-definitions" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feImage id="liquid-map" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/>
        <feDisplacementMap in="SourceGraphic" in2="map" scale="60" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <symbol id="project-arrow" viewBox="0 0 16 16">
        <path d="M4.5 11.5 11.5 4.5M5 4.5h6.5V11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>
  <main class="hero" aria-label="Стас Торопов и его проекты">
    <img id="portrait" class="portrait" src="assets/hero-mobile-v7.png" width="941" height="1672" alt="Стас Торопов на диване среди цветов у моря" fetchpriority="high" decoding="async">
    <header class="identity">
      <h1><img class="wordmark" src="assets/wordmark.png" width="810" height="179" alt="Стас Торопов"></h1>
    </header>
    <div class="projects">
      <p class="project-hint" id="project-hint">
        <span>Листай вправо</span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h10m-4-4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </p>
      <nav class="project-track" id="project-track" aria-label="Проекты Стаса Торопова" aria-describedby="project-hint">
        <a class="project-link" href="https://stastoropov.ru/" aria-labelledby="host-title host-action" aria-describedby="host-description">
          <span class="glass" aria-hidden="true"></span>
          <img class="project-thumb" src="assets/project-icon-host.svg" width="88" height="88" alt="">
          <div class="project-copy">
            <h2 id="host-title">Стас Торопов</h2>
            <p class="project-description" id="host-description">Ведущий свадеб и корпоративов</p>
          </div>
          <span class="project-action" id="host-action">На сайт<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-arrow"/></svg></span>
        </a>
        <a class="project-link" href="https://help-wedding.ru/" aria-labelledby="wedding-title wedding-action" aria-describedby="wedding-description">
          <span class="glass" aria-hidden="true"></span>
          <img class="project-thumb" src="assets/project-icon-wedding.svg" width="88" height="88" alt="">
          <div class="project-copy">
            <h2 id="wedding-title">В титрах</h2>
            <p class="project-description" id="wedding-description">Свадебное агентство</p>
          </div>
          <span class="project-action" id="wedding-action">На сайт<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-arrow"/></svg></span>
        </a>
        <a class="project-link" href="https://st-event.com/" aria-labelledby="events-title events-action" aria-describedby="events-description">
          <span class="glass" aria-hidden="true"></span>
          <img class="project-thumb project-thumb-logo" src="assets/project-icon-events.png" width="88" height="88" alt="">
          <div class="project-copy">
            <h2 id="events-title">ST EVENT</h2>
            <p class="project-description" id="events-description">Корпоративы и деловые события</p>
          </div>
          <span class="project-action" id="events-action">На сайт<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-arrow"/></svg></span>
        </a>
        <a class="project-link" href="https://karaokerave.ru/" aria-labelledby="karaoke-title karaoke-action" aria-describedby="karaoke-description">
          <span class="glass" aria-hidden="true"></span>
          <img class="project-thumb project-thumb-logo" src="assets/project-icon-karaoke.svg" width="88" height="88" alt="">
          <div class="project-copy">
            <h2 id="karaoke-title">Караоке Рейв</h2>
            <p class="project-description" id="karaoke-description">Караоке с живым оркестром</p>
          </div>
          <span class="project-action" id="karaoke-action">На сайт<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-arrow"/></svg></span>
        </a>
        <a class="project-link" href="https://ngperm.ru/" aria-labelledby="newyear-title newyear-action" aria-describedby="newyear-description">
          <span class="glass" aria-hidden="true"></span>
          <img class="project-thumb" src="assets/project-icon-newyear.svg" width="88" height="88" alt="">
          <div class="project-copy">
            <h2 id="newyear-title">Новогодняя ночь</h2>
            <p class="project-description" id="newyear-description">31 декабря · WHITE HALL</p>
          </div>
          <span class="project-action" id="newyear-action">На сайт<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-arrow"/></svg></span>
        </a>
      </nav>
      <div class="project-pagination" role="group" aria-label="Переключить проект" hidden>
        <button type="button" aria-controls="project-track" aria-label="Показать проект «Стас Торопов»" aria-current="true"></button>
        <button type="button" aria-controls="project-track" aria-label="Показать проект «В титрах»"></button>
        <button type="button" aria-controls="project-track" aria-label="Показать проект ST EVENT"></button>
        <button type="button" aria-controls="project-track" aria-label="Показать проект «Караоке Рейв»"></button>
        <button type="button" aria-controls="project-track" aria-label="Показать проект «Новогодняя ночь»"></button>
      </div>
    </div>
  </main>
</body>
</html>
