<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#100f0f">
  <title>Стас Торопов — видеоинтро</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../mobile.css?v=14">
  <link rel="stylesheet" href="intro.css?v=2">
  <script src="../projects.js?v=8" defer></script>
  <script type="module" src="intro.js?v=2"></script>
</head>
<body>
  <svg class="filter-definitions" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="project-arrow" viewBox="0 0 16 16">
        <path d="M4.5 11.5 11.5 4.5M5 4.5h6.5V11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="project-step-arrow" viewBox="0 0 16 16">
        <path d="M2.5 8h10m-4-4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>
  <main class="experience" id="experience">
    <section class="stage" id="stage" data-state="portrait" aria-label="Стас Торопов и его проекты">
      <img class="intro-portrait" id="portrait" src="portrait-v2.jpg" width="1080" height="1920" alt="Стас Торопов в очках" fetchpriority="high">
      <div class="poster" aria-hidden="true"></div>
      <video id="reel" src="reel.mp4" muted playsinline preload="none" loop aria-hidden="true"></video>
      <canvas id="scene" aria-hidden="true" hidden></canvas>
      <div class="hero" id="hero-content" tabindex="-1">
    <header class="identity">
      <h1><img class="wordmark" src="../assets/wordmark.png" width="810" height="179" alt="Стас Торопов"></h1>
      <nav class="socials" aria-label="Социальные сети Стаса Торопова">
        <a href="https://vk.com/stastoropov" aria-label="Стас Торопов во ВКонтакте" title="ВКонтакте">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5h3.7c.3 4.5 1.6 7.2 3.8 8V5.5H14v4.6c2.2-.3 4.5-2.6 5.3-4.6H23c-.6 2.6-2.7 5-4.4 6.1 1.7.9 4.2 3 5.1 6.9h-4.1c-.9-2.6-2.8-4.6-5.6-4.9v4.9h-.4C6.8 18.5 3.3 14 3 5.5Z" fill="currentColor" transform="translate(-1 0)"/></svg>
        </a>
        <a href="https://t.me/stas_toropov" aria-label="Канал Стаса Торопова в Telegram" title="Telegram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.2 10.7 16.9-6.5c.8-.3 1.5.2 1.2 1.4l-2.9 13.7c-.2 1-1 1.2-1.8.7l-4.4-3.3-2.1 2c-.3.3-.5.5-1 .5l.3-4.5 8.2-7.4c.4-.3-.1-.5-.6-.2L6.9 13.5l-4.3-1.4c-.9-.3-.9-.9.6-1.4Z" fill="currentColor"/></svg>
        </a>
        <a href="https://www.instagram.com/stastoropov" aria-label="Стас Торопов в Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.8" r="1.1" fill="currentColor"/></svg>
        </a>
      </nav>
    </header>
    <div class="projects">
      <p class="project-hint" id="project-hint">
        <span>Листай вправо</span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-step-arrow"/></svg>
      </p>
      <nav class="project-track" id="project-track" aria-label="Проекты Стаса Торопова" aria-describedby="project-hint">
        <a class="project-link" href="https://stastoropov.ru/" aria-labelledby="host-title host-action" aria-describedby="host-description">
          <span class="glass" aria-hidden="true"></span>
          <div class="project-panel">
            <img class="project-thumb" src="../assets/project-cover-host.jpg" width="88" height="88" alt="">
            <div class="project-copy">
              <h2 id="host-title">Стас Торопов</h2>
              <p class="project-description" id="host-description">Ведущий частных событий и корпоративных мероприятий</p>
            </div>
            <span class="project-action" id="host-action">На сайт<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-arrow"/></svg></span>
          </div>
        </a>
        <a class="project-link" href="https://help-wedding.ru/" aria-labelledby="wedding-title wedding-action" aria-describedby="wedding-description">
          <span class="glass" aria-hidden="true"></span>
          <div class="project-panel">
            <img class="project-thumb" src="../assets/project-cover-wedding.jpg" width="88" height="88" alt="">
            <div class="project-copy">
              <h2 id="wedding-title">В титрах</h2>
              <p class="project-description" id="wedding-description">Свадебное агентство</p>
            </div>
            <span class="project-action" id="wedding-action">На сайт<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-arrow"/></svg></span>
          </div>
        </a>
        <a class="project-link" href="https://st-event.com/" aria-labelledby="events-title events-action" aria-describedby="events-description">
          <span class="glass" aria-hidden="true"></span>
          <div class="project-panel">
            <img class="project-thumb" src="../assets/project-cover-events.jpg" width="88" height="88" alt="">
            <div class="project-copy">
              <h2 id="events-title">ST EVENT</h2>
              <p class="project-description" id="events-description">Корпоративы и деловые события</p>
            </div>
            <span class="project-action" id="events-action">На сайт<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-arrow"/></svg></span>
          </div>
        </a>
        <a class="project-link" href="https://karaokerave.ru/" aria-labelledby="karaoke-title karaoke-action" aria-describedby="karaoke-description">
          <span class="glass" aria-hidden="true"></span>
          <div class="project-panel">
            <img class="project-thumb" src="../assets/project-cover-karaoke.jpg" width="88" height="88" alt="">
            <div class="project-copy">
              <h2 id="karaoke-title">Караоке Рейв</h2>
              <p class="project-description" id="karaoke-description">Караоке с живым оркестром</p>
            </div>
            <span class="project-action" id="karaoke-action">На сайт<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-arrow"/></svg></span>
          </div>
        </a>
        <a class="project-link" href="https://ngperm.ru/" aria-labelledby="newyear-title newyear-action" aria-describedby="newyear-description">
          <span class="glass" aria-hidden="true"></span>
          <div class="project-panel">
            <img class="project-thumb" src="../assets/project-cover-newyear.jpg" width="88" height="88" alt="">
            <div class="project-copy">
              <h2 id="newyear-title">Новогодняя ночь</h2>
              <p class="project-description" id="newyear-description">31 декабря · WHITE HALL</p>
            </div>
            <span class="project-action" id="newyear-action">На сайт<svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-arrow"/></svg></span>
          </div>
        </a>
      </nav>
      <div class="project-controls" role="group" aria-label="Переключить проект" hidden>
        <button class="project-step project-prev" type="button" aria-controls="project-track" aria-label="Предыдущий проект" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-step-arrow"/></svg>
        </button>
        <div class="project-pagination">
          <button type="button" aria-controls="project-track" aria-label="Показать проект «Стас Торопов»" aria-current="true"></button>
          <button type="button" aria-controls="project-track" aria-label="Показать проект «В титрах»"></button>
          <button type="button" aria-controls="project-track" aria-label="Показать проект ST EVENT"></button>
          <button type="button" aria-controls="project-track" aria-label="Показать проект «Караоке Рейв»"></button>
          <button type="button" aria-controls="project-track" aria-label="Показать проект «Новогодняя ночь»"></button>
        </div>
        <button class="project-step project-next" type="button" aria-controls="project-track" aria-label="Следующий проект">
          <svg viewBox="0 0 16 16" aria-hidden="true"><use href="#project-step-arrow"/></svg>
        </button>
      </div>
    </div>
      </div>
      <button class="intro-control skip" id="skip" type="button" hidden>Пропустить</button>
      <button class="intro-control advance" id="advance" type="button" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v13M5 11l5 5 5-5"/></svg>
        Прокрути вниз
      </button>
    </section>
  </main>
</body>
</html>
